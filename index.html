<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ADUANAS HERO</title>
  <link rel="stylesheet" href="./src/ui/theme.css" />
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- Aviso de rotación (solo móvil vertical, lo activa SceneManager) -->
  <div id="rotate-hint">
    <div>
      <span class="rh-ico">📱</span>
      <b>GIRA TU DISPOSITIVO</b>
      <p>Aduanas Hero se juega en horizontal.<br />Rota el teléfono para entrar en servicio.</p>
    </div>
  </div>

  <!-- Pantalla de título: el clic desbloquea el AudioContext -->
  <div id="title-screen">
    <div class="title-inner">
      <div class="title-badge">DIRECCIÓN DE ADUANAS · TURNO NOCHE</div>
      <h1>ADUANAS<br /><span>HERO</span></h1>
      <p class="title-sub">Llevas la placa. Todos te mienten.<br />Y si te equivocas, alguien paga las consecuencias.</p>
      <button id="btn-start">INICIAR TURNO</button>
      <p class="title-hint">Auriculares recomendados · 16+</p>
    </div>
  </div>

  <div id="hud-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
